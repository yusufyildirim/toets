name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # With pending changesets: opens or updates the "Version Packages" PR.
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # No pending changesets (the version PR was merged): publishes every package whose version is
  # not on npm yet. Authenticates with npm trusted publishing (OIDC), no token. Needs npm CLI
  # 11.5.1+ (bundled with the Node in .tool-versions) and a GitHub-hosted runner.
  publish:
    name: Publish
    needs: version
    if: needs.version.outputs.pending == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    outputs:
      published: ${{ steps.release.outputs.published }}
    permissions:
      contents: write # push release tags
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # `changeset publish` creates annotated tags, which need a committer identity. Without one
      # `git tag` fails and changesets ignores the failure.
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # `changeset publish` tags HEAD for every package it publishes; no new tag means nothing
      # was released. The checkout fetches no tags, so only this run's tags point at HEAD. Fails
      # when a logged tag is missing, so a release never silently skips tags and the docs deploy.
      - id: release
        run: |
          set -o pipefail
          pnpm release 2>&1 | tee "$RUNNER_TEMP/release.log"
          expected=$(grep -c 'New tag:' "$RUNNER_TEMP/release.log" || true)
          actual=$(git tag --points-at HEAD | wc -l)
          if [ "$expected" -ne "$actual" ]; then
            echo "::error::changeset publish logged $expected new tags but $actual exist at HEAD"
            exit 1
          fi
          if [ "$actual" -gt 0 ]; then published=true; else published=false; fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - run: git push origin --tags

  # After a release: deploys the docs site to GitHub Pages.
  docs:
    name: Docs
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
