name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # driver-web unit tests launch headless Chromium.
      - uses: ./.github/actions/setup-chromium
      # Format, lint, typecheck, API docs, unit tests (packages and examples) and the docs checks
      # (examples run against the docs' in-memory demo app, no browser).
      - run: pnpm check

  e2e-web:
    name: E2E (web, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/tv-app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build
        working-directory: .
      - uses: ./.github/actions/setup-chromium
      - run: pnpm build:web
      # Both web projects run in Chromium: with the in-app SDK and black-box.
      - run: pnpm e2e --project=web --project=web-blackbox
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-web-report
          path: |
            examples/tv-app/playwright-report/
            examples/tv-app/test-results/
            examples/tv-app/toets-report/
          if-no-files-found: ignore
          retention-days: 14
