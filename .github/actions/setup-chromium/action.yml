name: Setup Chromium
description: Install Playwright Chromium and its system dependencies, cached per Playwright version.
runs:
  using: composite
  steps:
    - name: Read the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(pnpm --dir examples/tv-app exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
    - name: Install Chromium
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --dir examples/tv-app exec playwright install --with-deps chromium
    - name: Install Chromium system dependencies
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --dir examples/tv-app exec playwright install-deps chromium
